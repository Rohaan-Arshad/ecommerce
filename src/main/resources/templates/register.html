<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Create account</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="card">
    <h1>Create account</h1>
    <p class="sub">Register with your email address.</p>

    <div th:if="${error}" class="alert error" th:text="${error}">Error</div>

    <form th:action="@{/register}" method="post">
        <label for="firstName">First name</label>
        <input type="text" id="firstName" name="firstName" th:value="${firstName}" required autofocus/>

        <label for="lastName">Last name</label>
        <input type="text" id="lastName" name="lastName" th:value="${lastName}"/>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" th:value="${email}" required/>

        <label for="phone">Phone (optional)</label>
        <input type="text" id="phone" name="phone" th:value="${phone}"/>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="6" required/>

        <button class="btn" type="submit">Create account</button>
    </form>

    <span class="muted-link">Already have an account? <a th:href="@{/login}">Sign in</a></span>
</div>
</body>
</html>
